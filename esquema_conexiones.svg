<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Filtros de sombra y brillo -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="oledGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Título y Encabezado -->
  <rect x="20" y="20" width="960" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="50" y="55" fill="#38bdf8" font-size="20" font-weight="bold">MediaLab UniOvi • Esquema de Conexiones del Taller</text>
  <text x="650" y="55" fill="#94a3b8" font-size="14">ESP32 + HC-SR04 + OLED + Buzzer</text>

  <!-- ========================================== -->
  <!-- 1. PLACA ESP32 (CENTRO IZQUIERDA)          -->
  <!-- ========================================== -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <!-- Cuerpo de la placa ESP32 -->
    <rect x="0" y="0" width="220" height="520" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="50" y="10" width="120" height="150" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <text x="110" y="80" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">ESP-WROOM-32</text>
    <text x="110" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">Wi-Fi &amp; Bluetooth</text>

    <!-- Conector MicroUSB -->
    <rect x="75" y="490" width="70" height="35" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
    <text x="110" y="512" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">USB</text>

    <!-- Botones BOOT y EN -->
    <rect x="25" y="470" width="24" height="24" rx="4" fill="#475569"/>
    <circle cx="37" cy="482" r="6" fill="#cbd5e1"/>
    <text x="37" y="508" fill="#94a3b8" font-size="9" text-anchor="middle">EN</text>

    <rect x="171" y="470" width="24" height="24" rx="4" fill="#475569"/>
    <circle cx="183" cy="482" r="6" fill="#ef4444"/>
    <text x="183" y="508" fill="#fca5a5" font-size="9" font-weight="bold" text-anchor="middle">BOOT</text>

    <!-- PINES DERECHA RELEVANTES -->
    <!-- VIN (5V) -->
    <rect x="195" y="180" width="25" height="14" rx="2" fill="url(#goldPin)"/>
    <text x="188" y="192" fill="#f87171" font-size="11" font-weight="bold" text-anchor="end">VIN (5V)</text>

    <!-- GND (Derecha) -->
    <rect x="195" y="210" width="25" height="14" rx="2" fill="url(#goldPin)"/>
    <text x="188" y="222" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="end">GND</text>

    <!-- GPIO 18 (Echo) -->
    <rect x="195" y="270" width="25" height="14" rx="2" fill="url(#goldPin)"/>
    <text x="188" y="282" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="end">GPIO 18 (ECHO)</text>

    <!-- GPIO 5 (Trig) -->
    <rect x="195" y="300" width="25" height="14" rx="2" fill="url(#goldPin)"/>
    <text x="188" y="312" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="end">GPIO 5 (TRIG)</text>

    <!-- GPIO 19 (Buzzer) -->
    <rect x="195" y="340" width="25" height="14" rx="2" fill="url(#goldPin)"/>
    <text x="188" y="352" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="end">GPIO 19 (BUZZER)</text>

    <!-- GPIO 21 (SDA) -->
    <rect x="195" y="390" width="25" height="14" rx="2" fill="url(#goldPin)"/>
    <text x="188" y="402" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="end">GPIO 21 (SDA)</text>

    <!-- GPIO 22 (SCL) -->
    <rect x="195" y="420" width="25" height="14" rx="2" fill="url(#goldPin)"/>
    <text x="188" y="432" fill="#fb923c" font-size="11" font-weight="bold" text-anchor="end">GPIO 22 (SCL)</text>

    <!-- PINES IZQUIERDA -->
    <!-- 3.3V -->
    <rect x="0" y="180" width="25" height="14" rx="2" fill="url(#goldPin)"/>
    <text x="32" y="192" fill="#38bdf8" font-size="11" font-weight="bold">3V3</text>

    <!-- GND (Izquierda) -->
    <rect x="0" y="210" width="25" height="14" rx="2" fill="url(#goldPin)"/>
    <text x="32" y="222" fill="#94a3b8" font-size="11" font-weight="bold">GND</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. SENSOR ULTRASÓNICO HC-SR04 (SUPERIOR)   -->
  <!-- ========================================== -->
  <g transform="translate(620, 100)" filter="url(#shadow)">
    <!-- PCB Azul -->
    <rect x="0" y="0" width="260" height="110" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <text x="130" y="25" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">SENSOR HC-SR04</text>

    <!-- Cápsulas transductoras T y R -->
    <circle cx="65" cy="65" r="32" fill="#64748b" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="65" cy="65" r="22" fill="#334155"/>
    <text x="65" y="70" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">T</text>

    <circle cx="195" cy="65" r="32" fill="#64748b" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="195" cy="65" r="22" fill="#334155"/>
    <text x="195" y="70" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">R</text>

    <!-- Pines de conexión inferiores -->
    <g transform="translate(85, 105)">
      <!-- VCC -->
      <rect x="0" y="0" width="12" height="20" fill="url(#goldPin)"/>
      <text x="6" y="32" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle">VCC</text>

      <!-- TRIG -->
      <rect x="25" y="0" width="12" height="20" fill="url(#goldPin)"/>
      <text x="31" y="32" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">TRIG</text>

      <!-- ECHO -->
      <rect x="50" y="0" width="12" height="20" fill="url(#goldPin)"/>
      <text x="56" y="32" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">ECHO</text>

      <!-- GND -->
      <rect x="75" y="0" width="12" height="20" fill="url(#goldPin)"/>
      <text x="81" y="32" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">GND</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 3. PANTALLA OLED SSD1306 (CENTRAL DERECHA) -->
  <!-- ========================================== -->
  <g transform="translate(640, 270)" filter="url(#shadow)">
    <!-- PCB Azul OLED -->
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <!-- Cristal Pantalla -->
    <rect x="25" y="35" width="170" height="95" rx="4" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>
    <text x="110" y="75" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">OLED 128x64</text>
    <text x="110" y="95" fill="#4ade80" font-size="11" text-anchor="middle">Dist: 25.4 cm [|||| ]</text>

    <!-- Pines superiores OLED -->
    <g transform="translate(45, 0)">
      <!-- GND -->
      <rect x="0" y="-15" width="15" height="15" fill="url(#goldPin)"/>
      <text x="7" y="-20" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">GND</text>

      <!-- VCC -->
      <rect x="35" y="-15" width="15" height="15" fill="url(#goldPin)"/>
      <text x="42" y="-20" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle">VCC</text>

      <!-- SCL -->
      <rect x="70" y="-15" width="15" height="15" fill="url(#goldPin)"/>
      <text x="77" y="-20" fill="#fb923c" font-size="10" font-weight="bold" text-anchor="middle">SCL</text>

      <!-- SDA -->
      <rect x="105" y="-15" width="15" height="15" fill="url(#goldPin)"/>
      <text x="112" y="-20" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle">SDA</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 4. BUZZER PIEZOELÉCTRICO (INFERIOR DERECHA)-->
  <!-- ========================================== -->
  <g transform="translate(690, 480)" filter="url(#shadow)">
    <!-- Cilindro Negro Buzzer -->
    <circle cx="60" cy="60" r="50" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <circle cx="60" cy="60" r="16" fill="#09090b"/>
    <text x="60" y="95" fill="#a1a1aa" font-size="11" font-weight="bold" text-anchor="middle">BUZZER</text>

    <!-- Terminales -->
    <circle cx="40" cy="120" r="6" fill="#cbd5e1"/>
    <text x="40" y="140" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">(+) GPIO 19</text>

    <circle cx="80" cy="120" r="6" fill="#cbd5e1"/>
    <text x="80" y="140" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">(-) GND</text>
  </g>

  <!-- ========================================== -->
  <!-- 5. CAJA DEL DIVISOR RESISTIVO (CENTRO)     -->
  <!-- ========================================== -->
  <g transform="translate(370, 240)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="95" y="22" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">DIVISOR RESISTIVO (5V ➔ 3.3V)</text>

    <!-- Resistencia R1 (1k) -->
    <rect x="25" y="40" width="55" height="18" rx="4" fill="#d97706"/>
    <text x="52" y="53" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">R1: 1kΩ</text>

    <!-- Resistencia R2 (2k) -->
    <rect x="110" y="40" width="55" height="18" rx="4" fill="#b45309"/>
    <text x="137" y="53" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">R2: 2kΩ</text>

    <text x="95" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">ECHO ➔ R1 ➔ GPIO 18</text>
    <text x="95" y="98" fill="#94a3b8" font-size="9" text-anchor="middle">GPIO 18 ➔ R2 ➔ GND</text>
  </g>

  <!-- ========================================== -->
  <!-- CABLES Y CONEXIONES (RUTAS SVG)            -->
  <!-- ========================================== -->
  <!-- 1. VCC 5V: ESP32 VIN (280, 297) -> HC-SR04 VCC (711, 215) -->
  <path d="M 280 297 L 340 297 L 340 180 L 711 180 L 711 205" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

  <!-- 2. TRIG: ESP32 GPIO 5 (280, 417) -> HC-SR04 TRIG (736, 215) -->
  <path d="M 280 417 L 330 417 L 330 200 L 736 200 L 736 205" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- 3. ECHO: HC-SR04 ECHO (761, 215) -> Divisor R1 Entrada (395, 290) -->
  <path d="M 761 205 L 761 225 L 395 225 L 395 280" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <!-- Divisor Salida R1/R2 (450, 290) -> ESP32 GPIO 18 (280, 387) -->
  <path d="M 450 280 L 450 387 L 280 387" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- 4. VCC 3.3V OLED: ESP32 3V3 (60, 297) -> OLED VCC (722, 255) -->
  <path d="M 60 297 L 30 297 L 30 650 L 610 650 L 610 240 L 722 240 L 722 255" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 5. I2C SDA: ESP32 GPIO 21 (280, 507) -> OLED SDA (792, 255) -->
  <path d="M 280 507 L 620 507 L 620 260 L 792 260 L 792 255" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>

  <!-- 6. I2C SCL: ESP32 GPIO 22 (280, 537) -> OLED SCL (757, 255) -->
  <path d="M 280 537 L 600 537 L 600 245 L 757 245 L 757 255" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>

  <!-- 7. BUZZER (+): ESP32 GPIO 19 (280, 457) -> Buzzer (+) (730, 600) -->
  <path d="M 280 457 L 580 457 L 580 600 L 730 600" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>

  <!-- 8. LÍNEAS DE MASA COMÚN (GND - NEGRO/GRIS) -->
  <!-- ESP32 GND (280, 327) hacia Buzzer (-), OLED GND, Divisor R2 GND y HC-SR04 GND -->
  <path d="M 280 327 L 360 327 L 360 670 L 890 670" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>
  <!-- Derivación GND a HC-SR04 -->
  <path d="M 786 205 L 786 215 L 890 215 L 890 670" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <!-- Derivación GND a OLED -->
  <path d="M 687 255 L 687 235 L 870 235 L 870 670" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <!-- Derivación GND a Buzzer (-) -->
  <path d="M 770 600 L 770 670" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <!-- Derivación GND a Divisor R2 -->
  <path d="M 505 298 L 505 327" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6,4"/>
</svg>
