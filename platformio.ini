; ==========================================
; Configuración del proyecto PlatformIO
; ==========================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidad del monitor serie (debe coincidir con Serial.begin en el código)
monitor_speed = 115200

; Librerías necesarias que PlatformIO descargará automáticamente
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
